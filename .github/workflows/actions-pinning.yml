name: Actions pinning
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: actions-pinning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned:
    name: Actions pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every `uses:` in .github must be a local path (./...) or an action
      # pinned to a full 40-character commit SHA followed by a version comment,
      # for example `owner/repo@<sha> # v1.2.3`. Tags and branches can be moved
      # to other code; a commit SHA cannot. Dependabot updates the SHA and the
      # comment together.
      - name: Check that every action is pinned by SHA
        run: |
          failures=0
          checked=0
          while IFS= read -r match; do
            file=${match%%:*}
            rest=${match#*:}
            line=${rest%%:*}
            text=${rest#*:}
            ref=$(printf '%s\n' "$text" \
              | sed -E 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*//; s/[[:space:]]+#.*$//; s/[[:space:]]+$//' \
              | tr -d "\"'")
            checked=$((checked + 1))
            case "$ref" in
              ./*) continue ;;
            esac
            if [[ ! "$ref" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}$ ]]; then
              echo "::error file=$file,line=$line::'$ref' is not pinned to a full commit SHA."
              failures=$((failures + 1))
            elif [[ ! "$text" =~ \#[[:space:]]*v?[0-9] ]]; then
              echo "::error file=$file,line=$line::'$ref' has no version comment (for example '# v1.2.3')."
              failures=$((failures + 1))
            fi
          done < <(grep -rnE --include='*.yml' --include='*.yaml' '^[[:space:]]*(-[[:space:]]*)?uses:' .github || true)
          echo "Checked $checked uses: references; $failures problem(s)."
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
