name: Bug report
description: Something in the app does not work as described in the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this form. Follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the exact UI labels (in Portuguese) where they help.
      placeholder: |
        1. Open "Minhas listas"
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android (Expo Go)
        - Android (build)
        - iOS (Expo Go)
        - iOS (build)
        - Web preview
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 7, Android 15
  - type: input
    id: commit
    attributes:
      label: Commit or branch
      placeholder: main @ a1b2c3d
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
